spring.application.name=Progetto_IdS_Hackathon
spring.datasource.url=jdbc:h2:file:~/hackathon-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Clock configuration
# Modes:
# - SYSTEM: uses current system time in configured zone
# - FIXED: uses a fixed instant, useful for deterministic local tests
app.clock.mode=FIXED
app.clock.zone=Europe/Rome
app.clock.fixed-instant=2026-03-27T12:00:00Z
