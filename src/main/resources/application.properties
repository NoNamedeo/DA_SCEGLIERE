spring.application.name=Progetto_IdS_Hackathon
spring.datasource.url=jdbc:h2:file:~/hackathon-db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/dev-refresh-seed.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Clock configuration
# Modes:
# - SYSTEM: uses current system time in configured zone
# - FIXED: uses a fixed instant, useful for deterministic local tests
app.clock.mode=FIXED
app.clock.zone=Europe/Rome
app.clock.fixed-instant=2026-03-29T12:00:00Z

# Team creation by invitation
app.team.min-members=2
app.team.invitation-ttl-days=21
app.scheduler.team-invitation-expiration-cron=0 */10 * * * *
